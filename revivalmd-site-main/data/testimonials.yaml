- name: "Ruthann C."
  service: "Botox Injections"
  rating: 5
  text: "Sanna Arshad is the absolute best doc ever. Her soft, subtle touch resulted in the most amazing painless results. I've had injections for years and always bruise, bleed, and experience a lot of pain — not this time! She was the most gentle doc I've ever been to. We discussed my goals and she really, genuinely listened. She is the most honest, down to earth, caring, compassionate, knowledgeable doc I've ever met. I received the best service, best results and the best pricing I have ever gotten in over 20 years getting botox injections."

- name: "Elda I."
  service: "Patient Care"
  rating: 5
  text: "I was able to schedule an appointment quickly and everyone — reception, nurses, physician assistant and the doctor — were wonderful. The patient was my mother, late stage Alzheimer's, 80-something. The nurses had a lovely bedside manner and were able to get her vitals with very little fuss. I never felt rushed and the nurses, PA and doctor took their time. It was very refreshing feeling like we were given undivided, undistracted attention. I would highly recommend this practice."

