{{ define "main" }}

<!-- Hero -->
<section class="relative py-16 md:py-24 bg-purple-950">
  <div class="absolute inset-0 bg-gradient-to-br from-purple-950 via-purple-900/80 to-purple-950"></div>
  <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <p class="text-gold-400/70 text-xs font-medium tracking-[0.3em] uppercase mb-4">Patient Stories</p>
    <h1 class="font-heading text-4xl sm:text-5xl text-white font-semibold mb-4">
      What Our Patients <span class="italic text-gold-400 font-normal">Say</span>
    </h1>
  </div>
</section>

<!-- Testimonials -->
<section class="py-16 md:py-24 bg-[#0d0013]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-8">
      {{ range .Site.Data.testimonials }}
      <div class="testimonial-card bg-white/[0.03] p-8 rounded-lg border border-white/[0.08] hover:border-gold-400/20 transition-all duration-300">
        <div class="flex gap-0.5 mb-4">
          {{ range seq .rating }}
          <svg class="w-4 h-4 text-gold-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
          {{ end }}
        </div>
        <blockquote class="text-gray-200/80 text-base leading-relaxed mb-6 font-light italic">
          &ldquo;{{ .text }}&rdquo;
        </blockquote>
        <div class="flex items-center justify-between">
          <div>
            <p class="font-medium text-white">{{ .name }}</p>
            <p class="text-white/40 text-sm">{{ .location }}</p>
          </div>
          <span class="text-xs tracking-wider uppercase text-gold-400/70 font-medium bg-gold-400/10 px-3 py-1 rounded-full">{{ .service }}</span>
        </div>
      </div>
      {{ end }}
    </div>

    <!-- Leave a review CTA -->
    <div class="text-center mt-12">
      <a href="/leave-a-review/"
         class="inline-flex items-center text-gold-400 hover:text-gold-300 text-sm font-medium tracking-wider uppercase transition-colors">
        Leave Us a Review &rarr;
      </a>
    </div>
  </div>
</section>

{{ end }}
