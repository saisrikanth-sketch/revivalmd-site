{{ define "main" }}
{{ partial "breadcrumbs.html" . }}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 bg-[#0d0013]">
  <header class="mb-12">
    <h1 class="font-heading text-4xl md:text-5xl text-white font-semibold mb-4">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="text-gray-300/70 text-lg font-light max-w-2xl">{{ . }}</p>
    {{ end }}
    <div class="w-16 h-px bg-gold-400 mt-6"></div>
  </header>

  {{ with .Content }}
  <div class="prose prose-invert prose-lg max-w-none mb-12
              prose-headings:font-heading prose-headings:text-white
              prose-p:text-gray-200/80
              prose-li:text-gray-200/80
              prose-a:text-gold-400 prose-a:no-underline hover:prose-a:text-gold-300
              prose-strong:text-white
              prose-h2:text-gold-400">
    {{ . }}
  </div>
  {{ end }}

  {{ if .Pages }}
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="service-card group block bg-white/[0.03] border border-white/[0.08] rounded-xl p-6 hover:border-gold-400/30 hover:bg-white/[0.06] transition-all">
      <h2 class="font-heading text-xl text-white font-semibold mb-2 group-hover:text-gold-400 transition-colors">
        {{ .Title }}
      </h2>
      {{ with .Description }}
      <p class="text-gray-300/60 text-sm font-light leading-relaxed">{{ . }}</p>
      {{ end }}
      <span class="mt-4 inline-flex items-center text-gold-400 text-sm font-medium">
        Learn More
        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </span>
    </a>
    {{ end }}
  </div>
  {{ end }}
</section>
{{ end }}
