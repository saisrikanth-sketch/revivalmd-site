<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ .Description }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Person",
    "name": "Haroon Arshad",
    "jobTitle": "Medical Director, MD, MBA",
    "url": "{{ .Site.BaseURL }}haroon-arshad-md-mba/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "RevivalMD Aesthetic Clinic",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ .Site.BaseURL }}images/logo-header.png"
    }
  },
  "image": "{{ with .Params.image }}{{ . }}{{ else }}{{ $.Site.Params.og_image | absURL }}{{ end }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
}
</script>
