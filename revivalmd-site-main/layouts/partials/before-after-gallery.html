{{/* Before/After Gallery — JS-loaded from /data/before-after.json, filtered by service slug */}}
{{ $slug := .File.BaseFileName }}

<section id="ba-section-{{ $slug }}" style="display:none;background:#0d0013;padding:5rem 0;border-top:1px solid rgba(255,255,255,0.04);">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:2.5rem;">
      <div>
        <p style="color:#C9A84C;font-size:0.65rem;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:0.6rem;">Real Results</p>
        <h2 class="font-heading text-white font-semibold" style="font-size:2rem;margin:0;">Before <em class="font-normal" style="color:#C9A84C;">&amp; After</em></h2>
      </div>
      <!-- Hidden until photos exist -->
      <p id="ba-count-{{ $slug }}" style="color:rgba(255,255,255,0.3);font-size:0.8rem;display:none;"></p>
    </div>

    <!-- Loading state -->
    <div id="ba-loading-{{ $slug }}" style="text-align:center;padding:3rem 0;">
      <div style="display:inline-block;width:32px;height:32px;border:2px solid rgba(201,168,76,0.2);border-top-color:#C9A84C;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    </div>

    <!-- Empty state -->
    <div id="ba-empty-{{ $slug }}" style="display:none;text-align:center;padding:4rem 2rem;background:rgba(255,255,255,0.015);border:1px dashed rgba(255,255,255,0.08);border-radius:1rem;">
      <svg style="margin:0 auto 1rem;display:block;opacity:0.3;" width="48" height="48" fill="none" stroke="#C9A84C" viewBox="0 0 24 24" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p style="color:rgba(255,255,255,0.35);font-size:0.9rem;margin:0 0 0.5rem;">No before &amp; after photos yet for this treatment.</p>
      <p style="color:rgba(255,255,255,0.2);font-size:0.8rem;margin:0;">Photos can be added via the <a href="/admin/" style="color:#C9A84C;text-decoration:none;">admin panel</a>.</p>
    </div>

    <!-- Gallery grid -->
    <div id="ba-grid-{{ $slug }}" style="display:none;"></div>

    <!-- Lightbox -->
    <div id="ba-lightbox-{{ $slug }}" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(13,0,19,0.96);backdrop-filter:blur(8px);align-items:center;justify-content:center;flex-direction:column;padding:1.5rem;">
      <button onclick="closeLightbox('{{ $slug }}')" style="position:absolute;top:1.5rem;right:1.5rem;background:rgba(255,255,255,0.08);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">&#x2715;</button>
      <div id="ba-lb-inner-{{ $slug }}" style="max-width:900px;width:100%;"></div>
      <p id="ba-lb-caption-{{ $slug }}" style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin-top:1rem;text-align:center;"></p>
    </div>
  </div>
</section>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .ba-card { cursor:pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .ba-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
</style>

<script>
(function() {
  var slug = "{{ $slug }}";

  function el(id) { return document.getElementById('ba-' + id + '-' + slug); }

  fetch('/data/before-after.json')
    .then(function(r) { return r.ok ? r.json() : []; })
    .catch(function() { return []; })
    .then(function(all) {
      el('loading').style.display = 'none';

      var photos = all.filter(function(p) {
        return p.service === slug && p.before && p.after;
      });

      if (photos.length === 0) {
        // Keep section hidden (starts hidden)
        return;
      }

      // Show the section now that we have photos
      document.getElementById('ba-section-' + slug).style.display = 'block';
      el('loading').style.display = 'none';

      var countEl = el('count');
      countEl.textContent = photos.length + ' result' + (photos.length !== 1 ? 's' : '');
      countEl.style.display = 'block';

      var grid = el('grid');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(auto-fill,minmax(300px,1fr))';
      grid.style.gap = '1.25rem';

      photos.forEach(function(p, i) {
        var card = document.createElement('div');
        card.className = 'ba-card';
        card.style.cssText = 'border-radius:0.75rem;overflow:hidden;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);';
        card.onclick = function() { openLightbox(slug, p); };

        card.innerHTML = [
          '<div style="display:grid;grid-template-columns:1fr 1fr;">',
            '<div style="position:relative;">',
              '<img src="' + p.before + '" alt="Before" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;" loading="lazy">',
              '<span style="position:absolute;bottom:8px;left:8px;background:rgba(13,0,19,0.75);color:rgba(255,255,255,0.7);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;">Before</span>',
            '</div>',
            '<div style="position:relative;">',
              '<img src="' + p.after + '" alt="After" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;" loading="lazy">',
              '<span style="position:absolute;bottom:8px;left:8px;background:rgba(201,168,76,0.85);color:#1a0026;font-size:0.6rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;">After</span>',
            '</div>',
          '</div>',
          p.caption ? '<p style="padding:0.75rem 1rem;color:rgba(255,255,255,0.45);font-size:0.8rem;margin:0;border-top:1px solid rgba(255,255,255,0.05);">' + p.caption + '</p>' : ''
        ].join('');

        grid.appendChild(card);
      });
    });
})();

function openLightbox(slug, p) {
  var lb = document.getElementById('ba-lightbox-' + slug);
  var inner = document.getElementById('ba-lb-inner-' + slug);
  var cap = document.getElementById('ba-lb-caption-' + slug);

  inner.innerHTML = [
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:0.5rem;overflow:hidden;">',
      '<div style="position:relative;">',
        '<img src="' + p.before + '" alt="Before" style="width:100%;max-height:70vh;object-fit:cover;display:block;">',
        '<span style="position:absolute;bottom:12px;left:12px;background:rgba(13,0,19,0.8);color:rgba(255,255,255,0.8);font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;padding:4px 10px;border-radius:2px;">Before</span>',
      '</div>',
      '<div style="position:relative;">',
        '<img src="' + p.after + '" alt="After" style="width:100%;max-height:70vh;object-fit:cover;display:block;">',
        '<span style="position:absolute;bottom:12px;left:12px;background:rgba(201,168,76,0.9);color:#1a0026;font-size:0.7rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;padding:4px 10px;border-radius:2px;">After</span>',
      '</div>',
    '</div>'
  ].join('');

  cap.textContent = p.caption || '';
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox(slug) {
  document.getElementById('ba-lightbox-' + slug).style.display = 'none';
  document.body.style.overflow = '';
}
</script>
