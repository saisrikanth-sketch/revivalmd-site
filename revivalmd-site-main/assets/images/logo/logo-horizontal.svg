<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" role="img" aria-label="RevivalMD Aesthetic Clinic">
  <title>RevivalMD Aesthetic Clinic</title>
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#A08338"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="55%" stop-color="#E8D5A0"/>
      <stop offset="75%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#96792E"/>
    </linearGradient>
    <linearGradient id="ht" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A08338"/>
      <stop offset="50%" stop-color="#C4A24A"/>
      <stop offset="100%" stop-color="#8C6E28"/>
    </linearGradient>
    <linearGradient id="hfp" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A0E4E"/>
      <stop offset="30%" stop-color="#3B0054"/>
      <stop offset="100%" stop-color="#220030"/>
    </linearGradient>
  </defs>

  <!-- ===== Circle Icon (left, scaled to ~110px) ===== -->
  <g transform="translate(58, 65) scale(0.21)">
    <!-- Outer purple ring -->
    <path d="M 370,88 A 210,210 0 1,1 340,78"
          fill="none" stroke="#4A1060" stroke-width="6" stroke-linecap="round"/>
    <!-- Inner gold ring -->
    <path d="M 105,335 A 195,195 0 1,0 355,100"
          fill="none" stroke="url(#hg)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 105,335 C 90,355 85,360 80,362"
          fill="none" stroke="url(#hg)" stroke-width="7" stroke-linecap="round"/>
    <!-- White interior -->
    <circle cx="260" cy="265" r="188" fill="#FFFFFF"/>
    <!-- Feather -->
    <path d="M 418,52 C 395,75 360,115 338,152 C 315,190 300,225 290,260 C 285,278 282,290 280,298 C 295,282 315,255 330,230 C 350,198 375,158 395,125 C 410,100 425,72 418,52Z"
          fill="url(#hfp)"/>
    <path d="M 418,52 C 430,68 438,95 435,125 C 432,155 420,190 400,222 C 380,255 355,282 330,300 C 318,308 305,312 295,313 C 290,305 285,298 280,298 C 300,278 325,248 348,215 C 370,182 392,142 410,105 C 420,82 422,65 418,52Z"
          fill="url(#hfp)" opacity="0.85"/>
    <path d="M 418,52 C 410,80 390,130 368,175 C 345,222 320,262 295,295 C 288,304 283,308 280,310"
          fill="none" stroke="url(#hg)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 410,72 C 398,85 382,102 370,112" fill="none" stroke="url(#hg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 400,100 C 385,115 368,132 352,148" fill="none" stroke="url(#hg)" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M 388,132 C 372,148 352,168 338,182" fill="none" stroke="url(#hg)" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 410,72 C 420,82 428,98 432,110" fill="none" stroke="url(#hg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 400,100 C 412,110 422,128 428,142" fill="none" stroke="url(#hg)" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- ===== Text (right side) ===== -->
  <!-- "Revival" -->
  <text x="150" y="58" font-family="'Playfair Display', Georgia, serif"
        font-size="44" font-style="italic" font-weight="400"
        fill="url(#ht)" letter-spacing="1.5">Revival</text>

  <!-- "MD" -->
  <text x="152" y="95" font-family="'Inter', 'Helvetica Neue', sans-serif"
        font-size="30" font-weight="500"
        fill="url(#ht)" letter-spacing="7">MD</text>

  <!-- "AESTHETIC CLINIC" subtitle -->
  <text x="152" y="115" font-family="'Inter', 'Helvetica Neue', sans-serif"
        font-size="10" font-weight="300"
        fill="#4A1060" letter-spacing="3.5">AESTHETIC CLINIC</text>
</svg>
